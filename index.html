<!DOCTYPE html>
<html lang="en">
<head>
  <!-- /=== META START ===/ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Painting With Lester — original paintings, fine art prints, artist tools, and creative energy." />
  <title>Painting With Lester | Interactive Palette Studio</title>
  <!-- /=== META END ===/ -->

  <!-- /=== CSS START ===/ -->
  <link rel="stylesheet" href="css/style.css" />
  <!-- /=== CSS END ===/ -->



<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">

</head>

<body>
  <!-- /=== TOP BAR START ===/ -->
  <header class="topbar">
    <div class="site-shell topbar-inner">
      <a href="javascript:void(0)" class="brand" onclick="switchSection('home')" aria-label="Painting With Lester home">
        <span class="brand-mark">🎨</span>
        <span>Painting With Lester</span>
      </a>

<!--Hamburger BTN END-->
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open social links">
        ☰
      </button>

    <nav class="socials" id="socialMenu" aria-label="Social media links">
      <a href="https://www.youtube.com/@PaintingWithLester" target="_blank" rel="noreferrer">YouTube</a>
      <a href="https://tiktok.com/@lestermaurerthepainter" target="_blank" rel="noreferrer">TikTok</a>
      <a href="https://www.instagram.com/lester.maurer" target="_blank" rel="noreferrer">Instagram</a>
    </nav>
    <!--Hamburger BTN END-->
    
    </div>
  </header>
  <!-- /=== TOP BAR END ===/ -->

  <!-- /=== PALETTE STUDIO APP START ===/ -->
  <main class="palette-stage">
    <div class="site-shell studio-layout">

<!-- /=== PALETTE SIDEBAR START ===/ -->
<aside class="palette-column" aria-label="Interactive paint palette navigation">
  <div class="main-palette" id="mainPalette">
    <button class="paint-well well-home active" data-section="home" aria-label="Home">
      <span>🏠</span><small>Home</small>
    </button>

    <button class="paint-well well-gallery" data-section="gallery" aria-label="Gallery">
      <span>🖼️</span><small>Gallery</small>
    </button>

    <button class="paint-well well-shop" data-section="shop" aria-label="Shop">
      <span>🛒</span><small>Shop</small>
    </button>

    <button class="paint-well well-tools" data-section="tools" aria-label="Tools">
      <span>🛠️</span><small>Tools</small>
    </button>

    <button class="paint-well well-about" data-section="about" aria-label="About">
      <span>👤</span><small>About</small>
    </button>

    <button class="paint-well well-socials" data-section="socials" aria-label="Socials">
      <span>📣</span><small>Socials</small>
    </button>

    <div class="palette-center-logo">PWL</div>
  </div>

  <div class="sidebar-stats">
    <div><span>Originals</span><strong>Ship</strong></div>
    <div><span>Prints</span><strong>Order</strong></div>
    <div><span>Tools</span><strong>Create</strong></div>
  </div>

  <p class="palette-label">Click a paint color to mix the page</p>
</aside>
<!-- /=== PALETTE SIDEBAR END ===/ -->

      <!-- /=== MAIN CONTENT CANVAS START ===/ -->
      <section class="canvas-wrap">
        <div class="content-canvas" id="contentCanvas" aria-live="polite"></div>
      </section>
      <!-- /=== MAIN CONTENT CANVAS END ===/ -->

    </div>
  </main>
  <!-- /=== PALETTE STUDIO APP END ===/ -->

<!-- /=== FLOATING CART START ===/ -->
<button class="floating-cart" id="floatingCart" onclick="showCart()" type="button">
  <span>🛒</span>
  <div>
    <small>Cart</small>
    <strong id="floatingCartCount">0</strong>
  </div>
</button>
<!-- /=== FLOATING CART END ===/ -->


  <!-- /=== JAVASCRIPT START ===/ -->
  <script src="js/script.js"></script>
  <!-- /=== JAVASCRIPT END ===/ -->
</body>
</html>
