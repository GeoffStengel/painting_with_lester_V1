<!DOCTYPE html>
<html lang="en">
<head>
  <!-- /=== META START ===/ -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Painting With Lester — original paintings, fine art prints, artist tools, and creative energy." />
  <!-- /=== FAVICON START ===/ -->
<link rel="icon" type="image/svg+xml" href="assets/paint_palette_svg_06_labels.svg">
<link rel="shortcut icon" href="assets/paint_palette_svg_06_labels.svg">
<!-- /=== FAVICON END ===/ -->
  <title>Painting With Lester | Interactive Palette Studio 🎨</title>
  <!-- /=== META END ===/ -->

  <!-- /=== CSS START ===/ -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/palette.css">
<link rel="stylesheet" href="css/sections.css">
<link rel="stylesheet" href="css/shop.css">
<link rel="stylesheet" href="css/tools.css">
<link rel="stylesheet" href="css/cart.css">
<link rel="stylesheet" href="css/responsive.css">
  <!-- /=== CSS END ===/ -->



<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200..900&display=swap" rel="stylesheet">

</head>

<body>
  <!-- /=== TOP BAR START ===/ -->
  <header class="topbar">
    <div class="site-shell topbar-inner">
      <a href="javascript:void(0)" class="brand" onclick="switchSection('home')" aria-label="Painting With Lester home">
        <span class="brand-mark">🎨</span>
        <span>Painting With Lester</span>
      </a>

<!--Hamburger BTN END-->
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open social links">
        ☰
      </button>

<nav class="main-nav" id="mainNav" aria-label="Main navigation">
  <button type="button" onclick="switchSection('shop')">Shop</button>
  <button type="button" onclick="switchSection('gallery')">Gallery</button>
  <button type="button" onclick="switchSection('tools')">Tools</button>
  <button type="button" onclick="switchSection('about')">About</button>
  <button type="button" onclick="switchSection('socials')">Socials</button>
</nav>
    <!--Hamburger BTN END-->
    
    </div>
  </header>
  <!-- /=== TOP BAR END ===/ -->

  <!-- /=== PALETTE STUDIO APP START ===/ -->
  <main class="palette-stage">
    <div class="site-shell studio-layout">

<!-- /=== PALETTE SIDEBAR START ===/ -->
<aside class="palette-column" aria-label="Interactive paint palette navigation">
<div class="main-palette svg-palette" id="mainPalette">
  <object
    id="paletteSvg"
    class="palette-svg-object"
    type="image/svg+xml"
    data="assets/paint_palette_svg_06_labels.svg"
    aria-label="Interactive paint palette navigation"
  ></object>

  <div id="paletteTooltip" class="palette-tooltip" aria-hidden="true"></div>
</div>

  <div class="sidebar-stats">
    <div><span>Originals</span><strong>Ship</strong></div>
    <div><span>Prints</span><strong>Order</strong></div>
    <div><span>Tools</span><strong>Create</strong></div>
  </div>

  <p class="palette-label">Click a paint color to mix the page</p>
</aside>
<!-- /=== PALETTE SIDEBAR END ===/ -->

      <!-- /=== MAIN CONTENT CANVAS START ===/ -->
      <section class="canvas-wrap">
        <div class="content-canvas" id="contentCanvas" aria-live="polite"></div>
      </section>
      <!-- /=== MAIN CONTENT CANVAS END ===/ -->

    </div>
  </main>
  <!-- /=== PALETTE STUDIO APP END ===/ -->

<!-- /=== FLOATING CART START ===/ -->
<button class="floating-cart" id="floatingCart" onclick="showCart()" type="button">
  <span>🛒</span>

  <div>
    <small>Cart</small>
    <strong
      id="floatingCartCount"
      class="cart-count"
      data-cart-count
    >0</strong>
  </div>
</button>
<!-- /=== FLOATING CART END ===/ -->


  <!-- /=== JAVASCRIPT START ===/ -->
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/tools.js"></script>
<script src="js/sections.js"></script>
<script src="js/shop.js"></script>
<script src="js/palette.js"></script>
<script src="js/script.js"></script>
  <!-- /=== JAVASCRIPT END ===/ -->
</body>
</html>
